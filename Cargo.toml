[workspace]
members = ["crates/*", "apps/desktop"]

[workspace.dependencies]
wallhaven = { path = "crates/wallhaven" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2.0.18"
ts-rs = "12.0.1"
tokio = "1.52.3"
log = "0.4.29"
